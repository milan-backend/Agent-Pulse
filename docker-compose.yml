services:

  db:
    image: postgres:15
    container_name: dag_db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dag_db

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: dag_redis
    restart: always

    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: dag_backend

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_started

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/dag_db
      REDIS_URL: redis://redis:6379/0

    volumes:
      - .:/app

    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  celery_worker:
    build: .
    container_name: dag_celery

    # 🟢 CHANGED HERE: Pointing to the master app and adding memory protection
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4 --max-tasks-per-child=10

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_started

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/dag_db
      REDIS_URL: redis://redis:6379/0

    volumes:
      - .:/app

  frontend:
    build: ./frontend
    container_name: agent_pulse_frontend

    working_dir: /app

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

volumes:
  postgres_data: